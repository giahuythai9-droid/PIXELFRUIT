/* V — Vô Lượng Không Xứ: kéo toàn bộ bot vào không gian khác, đứng im; melee x3.5 trong 20s; hồi 30s sau khi hết lãnh địa */
function gxSplatShape(r){const a=[[0,0,r]],n=5+Math.floor(Math.random()*5);for(let i=0;i<n;i++){const an=Math.random()*6.283,d=r*(.6+Math.random()*.9);a.push([Math.cos(an)*d,Math.sin(an)*d,r*(.18+Math.random()*.4)])}for(let i=0;i<6;i++){const an=Math.random()*6.283,d=r*(1.4+Math.random()*1.3);a.push([Math.cos(an)*d,Math.sin(an)*d,r*(.04+Math.random()*.08)])}return a}
function gxSplat(x,y,sh,col,sc,al){if(al<=0||sc<=0)return;g.save();g.globalAlpha=Math.min(1,al);g.fillStyle=col;g.beginPath();for(const c of sh){const rr=Math.max(.6,c[2]*sc);g.moveTo(x+c[0]*sc+rr,y+c[1]*sc);g.arc(x+c[0]*sc,y+c[1]*sc,rr,0,7)}g.fill();g.restore()}
function gxVoid(){autoAim();P.f=aim.x<0?-1:1;P.lockT=Math.max(P.lockT,.9);P.inv=Math.max(P.inv,1.4);P.dash=0;sfx.charge();sflash(.6,'#fff');
 const k=m*16+3,L=20,RD=420,PR=450,SQ=.62,cx=P.x,cy=P.y,id=Math.random(),D={on:1};gxDomOn=1;
 T(.03,()=>{cd[k]=cdx[k]=50});
 const EX=RD+260,EY=(RD+260)*.8,wx=()=>(Math.random()*2-1),inEl=(rx,ry)=>{let x,y;do{x=wx();y=wx()}while(x*x+y*y>1);return[cx+x*rx,cy+y*ry]};
 const stars=[];for(let i=0;i<700;i++){const[x,y]=inEl(EX,EY);stars.push([x,y,1+Math.random()*1.6,Math.random()*6.28])}
 const smoke=[];for(let i=0;i<16;i++){const[x,y]=inEl(EX*.9,EY*.9);smoke.push([x,y,Math.random()*6.28])}
 const rim=[];for(let i=0;i<40;i++){const an=i*.157+Math.random()*.12,f=1+Math.random()*.22;rim.push({x:cx+Math.cos(an)*(RD+20)*f,y:cy+Math.sin(an)*(RD*SQ+60)*f,sh:gxSplatShape(16+Math.random()*34),ph:Math.random()*6})}
 const mid=[];for(let i=0;i<34;i++){const[x,y]=inEl(RD*.95,RD*.62);mid.push({x,y,sh:gxSplatShape(5+Math.random()*16),ph:Math.random()*6})}
 const drops=[];for(let i=0;i<70;i++){const[x,y]=inEl(RD,RD*.65);drops.push({x,y,sh:gxSplatShape(1.5+Math.random()*4),ph:Math.random()*6})}
 const ink=[];for(let i=0;i<4;i++)ink.push({a:i*1.57+.5,sh:gxSplatShape(8+Math.random()*6)});
 const burst0=[];for(let i=0;i<26;i++){const a=i*.2417+Math.random()*.2;burst0.push({a,v:.5+Math.random()*.9,sh:gxSplatShape(10+Math.random()*24),c:i%4===0?'#000':'#fff'})}
 /* mở màn: vệt mực trắng-đen bắn ra khắp màn hình */
 zfx(.8,f=>{const el=1-f.life/f.mx,al=Math.min(1,f.life/f.mx*2.2),ox=camX+W/2,oy=camY+H/2;for(const b of burst0){const d=10+el*b.v*260;gxSplat(ox+Math.cos(b.a)*d,oy+Math.sin(b.a)*d*.8,b.sh,b.c,.4+el*1.2*b.v,al)}});
 const op=f=>zEase((f.mx-f.life-.2)/.5)*Math.min(1,f.life/.4);
 const place=i=>{const an=i*2.399,r=Math.min(RD*.85,45+Math.sqrt(i)*22);let x=cx+Math.cos(an)*r,y=cy+Math.sin(an)*r*SQ;if(Math.hypot(x-P.x,y-P.y)<45){x+=Math.cos(an)*50;y+=Math.sin(an)*40}return[Math.max(14,Math.min(WW-14,x)),Math.max(14,Math.min(WH-14,y))]};
 let pulled=0;
 const pull=()=>{if(!D.on||gameOver)return;let n=0;for(const e of E){if(e.hp<=0||e._dm===id||Math.hypot(e.x-cx,e.y-cy)>PR)continue;const[nx,ny]=place(pulled++);if(n++<40){burst(e.x,e.y,['#9fd0ff','#fff'],4,90,4);burst(nx,ny,['#9fd0ff','#fff'],5,110,4)}e._dm=id;e.fx=nx;e.fy=ny;e.x=nx;e.y=ny;e.stun=Math.max(e.stun||0,.3);e.ret=0}
  if(n){sfx.whoosh();sh(4)}T(.5,pull)};
 T(.55,pull);
 /* không gian khác: nền đặc che hẳn thế giới thật, cố định theo toạ độ thế giới (không chạy theo camera) */
 const inCam=(x,y,m)=>x>camX-m&&x<camX+W+m&&y>camY-m&&y<camY+H+m;
 zfx(L+.1,f=>{if(!D.on)return;const o=op(f);if(o<=.01)return;g.globalCompositeOperation='source-over';
  g.globalAlpha=o;g.fillStyle='#030816';g.fillRect(camX-2,camY-2,W+4,H+4);
  {const q=g.createRadialGradient(cx,cy-40,20,cx,cy-40,EX);q.addColorStop(0,'rgba(30,62,125,.7)');q.addColorStop(.5,'rgba(10,22,60,.55)');q.addColorStop(1,'rgba(2,5,18,0)');g.fillStyle=q;g.fillRect(camX-2,camY-2,W+4,H+4)}
  g.save();g.globalCompositeOperation='lighter';
  for(const s of smoke){const x=s[0]+Math.sin(t*.25+s[2])*40,y=s[1]+Math.cos(t*.2+s[2])*16;if(inCam(x,y,90))gjGlow(x,y,85,'#4a7ab0',.11*o)}
  for(const s of stars){if(!inCam(s[0],s[1],4))continue;g.globalAlpha=(.4+.6*Math.abs(Math.sin(t*3+s[3])))*o;g.fillStyle=s[3]>3?'#cfe0ff':'#fff';g.fillRect(s[0]|0,s[1]|0,s[2],s[2])}
  g.restore();
  for(const b of rim){if(!inCam(b.x,b.y,90))continue;const fl=.78+.22*Math.sin(t*4+b.ph);gjGlow(b.x,b.y,30,'#bcd8ff',.2*fl*o);gxSplat(b.x,b.y,b.sh,'#f4f8ff',1,.93*fl*o)}
  for(const b of mid){if(!inCam(b.x,b.y,40))continue;const fl=.8+.2*Math.sin(t*3+b.ph);gxSplat(b.x,b.y,b.sh,'#eaf2ff',1,.85*fl*o)}
  for(const b of drops){if(!inCam(b.x,b.y,10))continue;gxSplat(b.x,b.y,b.sh,'#dfeaff',1,.75*o)}
  /* hố đen cố định giữa không gian */
  const hx=cx,hy=cy-105,R0=34*Math.min(1,Math.max(0,(f.mx-f.life-.3)/.5));
  if(R0>2&&inCam(hx,hy,R0+90)){gjGlow(hx,hy,130,'#5a90c8',.5*o);for(let i=0;i<4;i++)gjRing(hx,hy,R0+10+i*9,2.8-i*.5,i%2?'#8fc4ff':'#cfe6ff',(.8-i*.14)*o);gjSwirl(hx,hy,R0+6,6,t*2,'#dff0ff',.8*o);
   g.save();g.globalAlpha=o;g.fillStyle='#02050c';g.beginPath();g.arc(hx,hy,R0,0,7);g.fill();g.strokeStyle='#9fd0ff';g.lineWidth=2;g.globalAlpha=.85*o;g.stroke();g.restore();
   for(const b of ink)gxSplat(hx+Math.cos(b.a+t*.2)*(R0+16),hy+Math.sin(b.a+t*.2)*(R0+16),b.sh,'#000',1,.95*o)}},{gnd:1});
 /* logic: giữ bot đứng im, nhốt người chơi trong không gian */
 zfx(L+.1,f=>{if(gameOver){D.on=0}if(!D.on)return;
  for(const e of E){if(e._dm===id){e.x=e.fx;e.y=e.fy;e.stun=Math.max(e.stun||0,.3)}}
  if(f.mx-f.life>.9){const dx=(P.x-cx)/(RD*.93),dy=(P.y-cy)/(RD*.93*SQ),d=Math.hypot(dx,dy);if(d>1){P.x=cx+dx/d*RD*.93;P.y=cy+dy/d*RD*.93*SQ}}});
 T(L,()=>{D.on=0;gxDomOn=0;for(const e of E)if(e._dm===id){e._dm=0;e.stun=Math.max(e.stun||0,.6)}
  if(!gameOver){sfx.boom(60);sflash(.6,'#fff');sh(10);F.push({k:'txt',x:P.x,y:P.y-40,s:'Lãnh địa tan biến',life:1});cd[k]=cdx[k]=30}});
}
const GXA=[gxRed,gxBlue,gxPurple,gxVoid];

</script></body></html>
